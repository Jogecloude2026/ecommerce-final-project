name: Build and Push Images to ECR

on:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'pb/**', '.env', '.github/workflows/ecr-build-push.yml' ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency: ecr-build-push

jobs:
  services:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
    - id: list
      run: |
        echo 'list=["accounting","ad","agent","cart","chatbot","checkout","currency","email","flagd-ui","fraud-detection","frontend","frontend-proxy","image-provider","kafka","load-generator","mcp","opamp-server","opensearch","payment","product-catalog","quote","recommendation","shipping","telemetry-docs"]' >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    env:
      IMAGE: ecomerce/${{ matrix.service }}
      DOCKERFILE: ${{ matrix.service == 'cart' && 'src/cart/src/Dockerfile' || format('src/{0}/Dockerfile', matrix.service) }}
    steps:
    - uses: actions/checkout@v4

    - name: Log in to AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Log in to ECR (our images)
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Log in to ECR Public (base images)
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Create the ECR repository if it doesn't exist
      run: |
        aws ecr describe-repositories --repository-names "$IMAGE" ||
          aws ecr create-repository --repository-name "$IMAGE" --image-scanning-configuration scanOnPush=true

    - name: Read version pins from .env
      run: grep -E '^(OTEL_JAVA_AGENT_VERSION|OPENTELEMETRY_CPP_VERSION|OPAMP_GO_REF)=' .env >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ env.DOCKERFILE }}
        platforms: linux/amd64
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}
        push: true
        build-args: |
          OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
          OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
          OPAMP_GO_REF=${{ env.OPAMP_GO_REF }}
        tags: |
          ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}:${{ github.run_number }}
          ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}:latest
